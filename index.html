<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Life: Survival & MasterChef</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f4f8; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .game-card { background: white; width: 100%; max-width: 620px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { font-size: 1.4rem; text-align: center; color: #0f172a; margin-bottom: 18px; }
    
    .metrics { display: flex; justify-content: space-between; background: #e2e8f0; padding: 12px 18px; border-radius: 12px; margin-bottom: 16px; }
    .stat { text-align: center; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-top: 2px; }
    
    .budget-tracker { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
    .budget-title { font-size: 0.85rem; font-weight: 600; color: #475569; display: flex; justify-content: space-between; }
    .progress-bar-container { background: #e2e8f0; border-radius: 8px; height: 10px; width: 100%; margin-top: 8px; overflow: hidden; }
    .progress-bar { background: #10b981; height: 100%; width: 100%; transition: width 0.3s ease, background 0.3s ease; }
    
    .content-box { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 16px; border-radius: 8px; margin-bottom: 18px; line-height: 1.5; font-size: 0.98rem; }
    .highlight-badge { display: inline-block; background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; }
    
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .btn { background: white; border: 1.5px solid #cbd5e1; padding: 12px 14px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.92rem; font-weight: 500; transition: all 0.2s; color: #1e293b; }
    .btn:hover { border-color: #3b82f6; background: #eff6ff; }
    .action-btn { background: #3b82f6; color: white; border: none; font-weight: bold; text-align: center; }
    .action-btn:hover { background: #2563eb; }

    .rival-card { background: white; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 0.88rem; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🎓 Campus Life: Survival & MasterChef</h1>

    <div class="metrics">
      <div class="stat">
        <div class="stat-label">Health</div>
        <div class="stat-value" id="health-val">80%</div>
      </div>
      <div class="stat">
        <div class="stat-label">GPA</div>
        <div class="stat-value" id="gpa-val">3.40</div>
      </div>
      <div class="stat">
        <div class="stat-label">Wallet</div>
        <div class="stat-value" id="wallet-val">₹5,000</div>
      </div>
    </div>

    <div class="budget-tracker">
      <div class="budget-title">
        <span>Monthly Budget Safety</span>
        <span id="budget-status">Healthy</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="budget-progress"></div>
      </div>
    </div>

    <div class="content-box" id="main-content">
      <!-- Content Dynamic -->
    </div>

    <div class="options-grid" id="options-container">
      <!-- Options Dynamic -->
    </div>
  </div>

  <script>
    let health = 80;
    let gpa = 3.4;
    let wallet = 5000;
    const initialWallet = 5000;
    let recklessChoicesCount = 0;
    let gameState = "scenario_1";

    function updateUI() {
      document.getElementById('health-val').textContent = health + '%';
      document.getElementById('gpa-val').textContent = gpa.toFixed(2);
      document.getElementById('wallet-val').textContent = '₹' + wallet;

      const pct = Math.max(0, Math.min(100, (wallet / initialWallet) * 100));
      const pBar = document.getElementById('budget-progress');
      pBar.style.width = pct + '%';

      const statusEl = document.getElementById('budget-status');
      if (pct > 55) {
        pBar.style.background = '#10b981';
        statusEl.textContent = 'Healthy';
        statusEl.style.color = '#059669';
      } else if (pct > 25) {
        pBar.style.background = '#f59e0b';
        statusEl.textContent = 'Budget Danger!';
        statusEl.style.color = '#d97706';
      } else {
        pBar.style.background = '#ef4444';
        statusEl.textContent = 'Critical Debt Zone!';
        statusEl.style.color = '#dc2626';
      }
    }

    function renderScreen() {
      const box = document.getElementById('main-content');
      const opts = document.getElementById('options-container');
      opts.innerHTML = '';

      if (wallet <= 0) {
        box.innerHTML = `<span class="highlight-badge" style="background:#fee2e2; color:#b91c1c;">GAME OVER: BROKE & DEBT</span>
        <p>Aapka wallet bilkul khali ho gaya (₹0)! Bina budget soche reckless kharche karne ki wajah se semester ke beech mein hi dosto ke aage haath phailana pada!</p>`;
        opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Try Again</button>`;
        return;
      }
      if (health <= 25) {
        box.innerHTML = `<span class="highlight-badge" style="background:#fee2e2; color:#b91c1c;">HOSPITALIZED</span>
        <p>Severe burnout & poor nutrition! Health 25% se neeche gir gayi aur semester hospital mein beeta!</p>`;
        opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Try Again</button>`;
        return;
      }

      switch(gameState) {
        case "scenario_1":
          box.innerHTML = `<strong>Weekend Chill vs Reality:</strong> Exams 10 din door hain, par dosto ka group luxury club & rooftop cafe mein weekend blast plan kar raha hai.`;
          opts.innerHTML = `
            <button class="btn" onclick="recklessChoicesCount++; applyChoice(-2400, 5, -0.2, 'chef_intro')">🎉 Full Night Rooftop Party & Expensive Drinks (-₹2,400, -0.20 GPA, +5% Health)</button>
            <button class="btn" onclick="applyChoice(-250, 5, 0.05, 'chef_intro')">☕ Campus Canteen Chai & Group Revision (-₹250, +5% Health, +0.05 GPA)</button>
            <button class="btn" onclick="applyChoice(0, -5, 0.15, 'chef_intro')">📖 Hostel Mess & Late Night Solo Revision (₹0, -5% Health, +0.15 GPA)</button>
          `;
          break;

        case "chef_intro":
          box.innerHTML = `
            <span class="highlight-badge">ANNUAL HOSTEL MASTERCHEF CONTEST</span>
            <p>Hostel common room mein MasterChef challenge shuru ho chuka hai! Trophy + ₹600 cash prize hai. Saamne 2 tagdi rival teams hain:</p>
            <div class="rival-card">🔴 <strong>Team Alpha:</strong> Authentic Kashmiri Rogan Josh & Saffron Rice bana rahi hai.</div>
            <div class="rival-card">🔵 <strong>Team Spice:</strong> Authentic South Indian Masala Dosa with 3 dips bana rahi hai.</div>
            <p style="margin-top:8px;">Aap aur aapka partner kitchen counter par aate hain!</p>
          `;
          opts.innerHTML = `
            <button class="btn action-btn" onclick="gameState='chef_cook'; renderScreen();">Counter Sambhalo & Cooking Shuru Karo!</button>
          `;
          break;

        case "chef_cook":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#fee2e2; color:#dc2626;">KITCHEN CRISIS!</span>
            <p>Aapne Shahi Paneer gravy chadhayi thi, par aakhri moment par stove ki aanch tez ho gayi aur gravy jal kar smoky ho gayi! Paneer bhi adha toot gaya.</p>
            <p style="margin-top:6px;">Judges round review ke liye aane wale hain! Ab kya jugaad karein?</p>
          `;
          opts.innerHTML = `
            <button class="btn" onclick="chefOutcome('fusion')">💡 Master Desi Jugaad: Roasted Masala + Crumbled Paneer mix karke 'Smoky Charred Paneer Lababdar' bolkar serve karo!</button>
            <button class="btn" onclick="chefOutcome('mask')">Sugar aur extra paani daal kar jala hua taste dabane ki koshish karo (-₹150 supplies)</button>
            <button class="btn" onclick="chefOutcome('giveup')">Haar maan kar dish disqualify hone do (0 Effort)</button>
          `;
          break;

        case "chef_result_win":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#dcfce7; color:#15803d;">🏆 VICTORY: YOU ARE THE WINNER!</span>
            <p>Judges ne jab smoky fusion taste kiya toh shock ho gaye! <em>"Yeh rustic charred smoky flavor toh 5-star innovations jaisa hai!"</em></p>
            <p style="margin-top:6px;">Team Alpha aur Team Spice dekhte reh gaye aur aapne ₹600 Cash Prize + Trophy jeet li!</p>
          `;
          opts.innerHTML = `<button class="btn action-btn" onclick="gameState='scenario_splurge'; renderScreen();">Agle Week par Chalein ➡️</button>`;
          break;

        case "chef_result_loss":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#fee2e2; color:#dc2626;">DISQUALIFIED / LOSS</span>
            <p>Judges ko taste bilkul pasand nahi aaya. Team Alpha winner bani. Aapko kitchen safai ka fine dena pada (-₹300, -10% Health).</p>
          `;
          opts.innerHTML = `<button class="btn action-btn" onclick="gameState='scenario_splurge'; renderScreen();">Agle Week par Chalein ➡️</button>`;
          break;

        case "scenario_splurge":
          box.innerHTML = `<strong>Mid-Semester Impulsive Spending:</strong> E-commerce mega sale aayi hai aur naye sneakers/gadgets par discount chal raha hai. Saath hi semester project submit karna hai!`;
          opts.innerHTML = `
            <button class="btn" onclick="recklessChoicesCount++; applyChoice(-2000, 10, -0.2, 'scenario_exam')">👟 Sale mein Fancy Sneakers & Gadget order kar do (-₹2,000, +10% Health, -0.2 GPA)</button>
            <button class="btn" onclick="applyChoice(-400, 5, 0.05, 'scenario_exam')">☕ Bas thode stationery aur coffee supplies lo (-₹400, +5% Health, +0.05 GPA)</button>
            <button class="btn" onclick="applyChoice(0, -5, 0.1, 'scenario_exam')">🚫 Sale ignore karo aur lab project par dhyan do (₹0, -5% Health, +0.1 GPA)</button>
          `;
          break;

        case "scenario_exam":
          box.innerHTML = `<strong>Final Exam Revision Crunch:</strong> 3 din bache hain aur syllabus adha bacha hua hai!`;
          opts.innerHTML = `
            <button class="btn" onclick="recklessChoicesCount++; applyChoice(-1500, 0, 0.1, 'final_eval')">💸 Readymade Assignment/Notes khareed kar shortcut lo (-₹1,500, +0.1 GPA)</button>
            <button class="btn" onclick="applyChoice(0, -20, 0.25, 'final_eval')">☕ All-nighter maar kar khud comprehensive padhai karo (-20% Health, +0.25 GPA)</button>
            <button class="btn" onclick="applyChoice(-150, -5, 0.15, 'final_eval')">👥 Study group discussion aur library notes (-₹150, -5% Health, +0.15 GPA)</button>
          `;
          break;

        case "final_eval":
          showDynamicEnding(box, opts);
          break;
      }
    }

    function applyChoice(dW, dH, dG, nextState) {
      wallet += dW;
      health = Math.max(0, Math.min(100, health + dH));
      gpa = Math.max(0, Math.min(4.0, gpa + dG));
      gameState = nextState;
      updateUI();
      renderScreen();
    }

    function chefOutcome(type) {
      if(type === 'fusion') {
        wallet += 600;
        health = Math.min(100, health + 10);
        gameState = 'chef_result_win';
      } else if(type === 'mask') {
        wallet -= 300;
        health -= 10;
        gameState = 'chef_result_loss';
      } else {
        health -= 10;
        gameState = 'chef_result_loss';
      }
      updateUI();
      renderScreen();
    }

    function showDynamicEnding(box, opts) {
      let badge = "";
      let title = "";
      let desc = "";

      // Strict dynamic evaluation
      if (recklessChoicesCount >= 2 || wallet < 1200) {
        badge = `<span class="highlight-badge" style="background:#fee2e2; color:#b91c1c;">DISASTER ENDING: BROKE PARTY ANIMAL</span>`;
        title = "Paisa Khatam, Future Danger! 💸📉";
        desc = `Aapne pure semester reckless spending ki! Wallet mein bache sirf ₹${wallet} aur padhai drop ho kar GPA ${gpa.toFixed(2)} par aa gaya. Ab agle semester mess fee bharne ke bhi lale pad gaye!`;
      } else if (gpa < 3.3) {
        badge = `<span class="highlight-badge" style="background:#fef3c7; color:#b45309;">ENDING: ACADEMIC PROBATION</span>`;
        title = "Marks Gire, Warning Mili! ⚠️";
        desc = `Paise toh kisi tarah bachaye (₹${wallet}), par padhai ignore karne ki wajah se GPA gir kar ${gpa.toFixed(2)} reh gaya. College administration se warning letter aa gaya!`;
      } else if (health < 50) {
        badge = `<span class="highlight-badge" style="background:#fef3c7; color:#b45309;">ENDING: BURNT OUT SCHOLAR</span>`;
        title = "Padhai Toh Hui, Par Tabiyat Kharab! 🤒";
        desc = `GPA toh ${gpa.toFixed(2)} aa gaya, par bina soye jagte rehne se Health sirf ${health}% bachi. Pure vacation doctor ke chakkar kaatne padenge!`;
      } else if (wallet >= 2200 && gpa >= 3.6 && health >= 65 && recklessChoicesCount === 0) {
        badge = `<span class="highlight-badge" style="background:#dcfce7; color:#15803d;">PERFECT ENDING: CAMPUS LEGEND</span>`;
        title = "All-Rounder Mastermind! 🏆🌟";
        desc = `Incredible discipline! Health (${health}%), GPA (${gpa.toFixed(2)}), aur Wallet (₹${wallet}) teeno shandaar balance mein hain. Plus MasterChef ke signature smoky paneer ka charma poore hostel mein chha gaya!`;
      } else {
        badge = `<span class="highlight-badge">ENDING: THE RESILIENT SURVIVOR</span>`;
        title = "Average Survival! 🎓";
        desc = `Aapne na jyada kharcha kiya na extra topper bane. Semester safely cross ho gaya. Final Wallet: ₹${wallet} | GPA: ${gpa.toFixed(2)} | Health: ${health}%.`;
      }

      box.innerHTML = `${badge}<h3 style="margin: 8px 0;">${title}</h3><p>${desc}</p>`;
      opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Play Again With Different Choices</button>`;
    }

    function restart() {
      health = 80;
      gpa = 3.4;
      wallet = 5000;
      recklessChoicesCount = 0;
      gameState = "scenario_1";
      updateUI();
      renderScreen();
    }

    updateUI();
    renderScreen();
  </script>
</body>
</html>
