<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Life: Survival & MasterChef</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f4f8; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .game-card { background: white; width: 100%; max-width: 600px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { font-size: 1.4rem; text-align: center; color: #0f172a; margin-bottom: 18px; }
    
    .metrics { display: flex; justify-content: space-between; background: #e2e8f0; padding: 12px 18px; border-radius: 12px; margin-bottom: 16px; }
    .stat { text-align: center; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-top: 2px; }
    
    .budget-tracker { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
    .budget-title { font-size: 0.85rem; font-weight: 600; color: #475569; display: flex; justify-content: space-between; }
    .progress-bar-container { background: #e2e8f0; border-radius: 8px; height: 10px; width: 100%; margin-top: 8px; overflow: hidden; }
    .progress-bar { background: #10b981; height: 100%; width: 100%; transition: width 0.3s ease, background 0.3s ease; }
    
    .content-box { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 16px; border-radius: 8px; margin-bottom: 18px; line-height: 1.5; font-size: 1rem; }
    .highlight-badge { display: inline-block; background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; }
    
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .btn { background: white; border: 1.5px solid #cbd5e1; padding: 12px 14px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.95rem; font-weight: 500; transition: all 0.2s; color: #1e293b; }
    .btn:hover { border-color: #3b82f6; background: #eff6ff; }
    .action-btn { background: #3b82f6; color: white; border: none; font-weight: bold; text-align: center; }
    .action-btn:hover { background: #2563eb; }

    .rival-card { background: white; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🎓 Campus Life: Survival & MasterChef</h1>

    <div class="metrics">
      <div class="stat">
        <div class="stat-label">Health</div>
        <div class="stat-value" id="health-val">80%</div>
      </div>
      <div class="stat">
        <div class="stat-label">GPA</div>
        <div class="stat-value" id="gpa-val">3.50</div>
      </div>
      <div class="stat">
        <div class="stat-label">Wallet</div>
        <div class="stat-value" id="wallet-val">₹5,000</div>
      </div>
    </div>

    <div class="budget-tracker">
      <div class="budget-title">
        <span>Monthly Budget Safety</span>
        <span id="budget-status">Healthy</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="budget-progress"></div>
      </div>
    </div>

    <div class="content-box" id="main-content">
      <!-- Dynamic Story Screen -->
    </div>

    <div class="options-grid" id="options-container">
      <!-- Dynamic Buttons -->
    </div>
  </div>

  <script>
    let health = 80;
    let gpa = 3.5;
    let wallet = 5000;
    const initialWallet = 5000;
    let gameState = "scenario_1";

    function updateUI() {
      document.getElementById('health-val').textContent = health + '%';
      document.getElementById('gpa-val').textContent = gpa.toFixed(2);
      document.getElementById('wallet-val').textContent = '₹' + wallet;

      const pct = Math.max(0, Math.min(100, (wallet / initialWallet) * 100));
      const pBar = document.getElementById('budget-progress');
      pBar.style.width = pct + '%';

      const statusEl = document.getElementById('budget-status');
      if (pct > 60) {
        pBar.style.background = '#10b981';
        statusEl.textContent = 'Healthy';
        statusEl.style.color = '#059669';
      } else if (pct > 25) {
        pBar.style.background = '#f59e0b';
        statusEl.textContent = 'Budget Squeezed!';
        statusEl.style.color = '#d97706';
      } else {
        pBar.style.background = '#ef4444';
        statusEl.textContent = 'Bankruptcy Danger!';
        statusEl.style.color = '#dc2626';
      }
    }

    function renderScreen() {
      const box = document.getElementById('main-content');
      const opts = document.getElementById('options-container');
      opts.innerHTML = '';

      if (wallet <= 0) {
        box.innerHTML = `<span class="highlight-badge" style="background:#fee2e2; color:#b91c1c;">GAME OVER: BANKRUPT</span>
        <p>Aapka wallet bilkul khali ho gaya (₹0)! Udhaar lene ki naubat aa gayi aur campus survival khatam ho gaya.</p>`;
        opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Try Again</button>`;
        return;
      }
      if (health <= 20) {
        box.innerHTML = `<span class="highlight-badge" style="background:#fee2e2; color:#b91c1c;">HOSPITALIZED</span>
        <p>Extreme burnout aur laparwahi se health 20% se neeche gir gayi. Semester drop karna pada!</p>`;
        opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Try Again</button>`;
        return;
      }

      switch(gameState) {
        case "scenario_1":
          box.innerHTML = `<strong>Friday Night Dilemma:</strong> Exams 10 din door hain, par dosto ka group expensive cafe dinner ke liye insist kar raha hai.`;
          opts.innerHTML = `
            <button class="btn" onclick="applyChoice(-1500, 5, 0, 'chef_intro')">Expensive Cafe Dinner & Partying (-₹1,500, +5% Health)</button>
            <button class="btn" onclick="applyChoice(-200, 5, 0.05, 'chef_intro')">Campus Canteen Chai-Samosa & Group Study (-₹200, +5% Health, +0.05 GPA)</button>
            <button class="btn" onclick="applyChoice(0, -5, 0.1, 'chef_intro')">Hostel Mess Dinner & 2 Hours Focus Study (₹0, -5% Health, +0.1 GPA)</button>
          `;
          break;

        case "chef_intro":
          box.innerHTML = `
            <span class="highlight-badge">ANNUAL HOSTEL MASTERCHEF CONTEST</span>
            <p>Hostel common room mein MasterChef challenge shuru ho chuka hai! Cash prize ₹1,500 hai. Saamne 2 tagdi competitor teams hain:</p>
            <div class="rival-card">🔴 <strong>Team Alpha:</strong> Authentic Kashmiri Rogan Josh & Saffron Rice bana rahi hai.</div>
            <div class="rival-card">🔵 <strong>Team Spice:</strong> Authentic South Indian Masala Dosa with 3 dips bana rahi hai.</div>
            <p style="margin-top:8px;">Aap aur aapka partner kitchen counter par aate hain!</p>
          `;
          opts.innerHTML = `
            <button class="btn action-btn" onclick="gameState='chef_cook'; renderScreen();">Counter Sambhalo & Cooking Shuru Karo!</button>
          `;
          break;

        case "chef_cook":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#fee2e2; color:#dc2626;">KITCHEN CRISIS!</span>
            <p>Aapne Shahi Paneer gravy chadhayi thi, par aakhri moment par stove ki aanch tez ho gayi aur gravy jal kar smoky ho gayi! Paneer bhi adha toot gaya.</p>
            <p style="margin-top:6px;">Judges round review ke liye aane wale hain! Ab kya jugaad karein?</p>
          `;
          opts.innerHTML = `
            <button class="btn" onclick="chefOutcome('fusion')">💡 Master Desi Jugaad: Roasted Masala + Crumbled Paneer bhurji style bana kar 'Smoky Charred Paneer Lababdar' bolkar serve karo!</button>
            <button class="btn" onclick="chefOutcome('mask')">Sugar aur extra paani daal kar jala hua taste dabane ki koshish karo (-₹100 supplies)</button>
            <button class="btn" onclick="chefOutcome('giveup')">Haar maan kar dish disqualify hone do (0 Effort)</button>
          `;
          break;

        case "chef_result_win":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#dcfce7; color:#15803d;">🏆 VICTORY: YOU ARE THE WINNER!</span>
            <p>Judges ne jab smoky fusion taste kiya toh shock ho gaye! <em>"Yeh rustic charred smoky flavor toh 5-star innovations jaisa hai!"</em></p>
            <p style="margin-top:6px;">Team Alpha aur Team Spice dekhte reh gaye aur aapne ₹1,500 Cash Prize + Trophy jeet li!</p>
          `;
          opts.innerHTML = `<button class="btn action-btn" onclick="gameState='scenario_exam'; renderScreen();">Agle Semester Challenge par Chalein ➡️</button>`;
          break;

        case "chef_result_loss":
          box.innerHTML = `
            <span class="highlight-badge" style="background:#fee2e2; color:#dc2626;">DISQUALIFIED / LOSS</span>
            <p>Judges ko taste bilkul pasand nahi aaya. Team Alpha winner bani. Aapko kitchen safai ka fine dena pada (-₹200, -10% Health).</p>
          `;
          opts.innerHTML = `<button class="btn action-btn" onclick="gameState='scenario_exam'; renderScreen();">Agle Challenge par Chalein ➡️</button>`;
          break;

        case "scenario_exam":
          box.innerHTML = `<strong>Mid-Term Final Sprint:</strong> Semester end exams sar par hain. Revision plan choose kijiye:`;
          opts.innerHTML = `
            <button class="btn" onclick="applyChoice(-1000, 0, 0.3, 'final_eval')">Expensive Crash Course + Readymade Solved Papers (-₹1,000, +0.3 GPA)</button>
            <button class="btn" onclick="applyChoice(0, -20, 0.2, 'final_eval')">3 Raat Jag kar Khud Notes Compiling (-20% Health, +0.2 GPA)</button>
            <button class="btn" onclick="applyChoice(-150, -5, 0.15, 'final_eval')">Study Circle + Library Group Discussion (-₹150 Snacks, -5% Health, +0.15 GPA)</button>
          `;
          break;

        case "final_eval":
          showDynamicEnding(box, opts);
          break;
      }
    }

    function applyChoice(dW, dH, dG, nextState) {
      wallet += dW;
      health = Math.max(0, Math.min(100, health + dH));
      gpa = Math.max(0, Math.min(4.0, gpa + dG));
      gameState = nextState;
      updateUI();
      renderScreen();
    }

    function chefOutcome(type) {
      if(type === 'fusion') {
        wallet += 1500;
        health = Math.min(100, health + 15);
        gameState = 'chef_result_win';
      } else if(type === 'mask') {
        wallet -= 300;
        health -= 10;
        gameState = 'chef_result_loss';
      } else {
        health -= 10;
        gameState = 'chef_result_loss';
      }
      updateUI();
      renderScreen();
    }

    function showDynamicEnding(box, opts) {
      let badge = "";
      let title = "";
      let desc = "";

      if (wallet < 1500 && gpa >= 3.6) {
        badge = `<span class="highlight-badge" style="background:#fef3c7; color:#b45309;">ENDING: THE BROKE SCHOLAR</span>`;
        title = "Top Marks, Empty Pockets! 📚💸";
        desc = `Aapne GPA toh shandaar (${gpa.toFixed(2)}) bana liya, par wallet mein sirf ₹${wallet} bache. Semester ke end mein dosto se udhaar mangna pad raha hai!`;
      } else if (wallet > 3000 && gpa < 3.4) {
        badge = `<span class="highlight-badge" style="background:#fef3c7; color:#b45309;">ENDING: THE RICH SLACKER</span>`;
        title = "Paisa Hi Paisa, Par Marks Gayab! 💰📉";
        desc = `Wallet balance toh badhiya bacha liya (₹${wallet}), par padhai par dhyan na dene se GPA gir kar ${gpa.toFixed(2)} ho gaya. Remedial classes leni padengi!`;
      } else if (wallet >= 2500 && gpa >= 3.6 && health >= 65) {
        badge = `<span class="highlight-badge" style="background:#dcfce7; color:#15803d;">PERFECT ENDING: CAMPUS LEGEND</span>`;
        title = "All-Rounder Mastermind! 🏆🌟";
        desc = `Kamaal kar diya! Health (${health}%), GPA (${gpa.toFixed(2)}), aur Wallet (₹${wallet}) teeno perfect balance mein hain. Upar se MasterChef jugad ka kissa poore hostel mein famous ho gaya!`;
      } else {
        badge = `<span class="highlight-badge">ENDING: THE SURVIVOR</span>`;
        title = "Semester Pushed Through! 🎓";
        desc = `Jaise-taise balance banakar aapne semester nikal liya. Final Wallet: ₹${wallet} | GPA: ${gpa.toFixed(2)} | Health: ${health}%. Agle semester thodi aur planning lagegi!`;
      }

      box.innerHTML = `${badge}<h3 style="margin: 8px 0;">${title}</h3><p>${desc}</p>`;
      opts.innerHTML = `<button class="btn action-btn" onclick="restart()">Play Again With Different Choices</button>`;
    }

    function restart() {
      health = 80;
      gpa = 3.5;
      wallet = 5000;
      gameState = "scenario_1";
      updateUI();
      renderScreen();
    }

    updateUI();
    renderScreen();
  </script>
</body>
</html>
